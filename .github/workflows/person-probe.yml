name: Person credits probe
on:
  push:
    branches: [imdb-people]
    paths: [scripts/person-probe.mjs, personCredits.js]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --silent
      - run: mkdir -p /tmp/d && DATA_DIR=/tmp/d node scripts/person-probe.mjs
